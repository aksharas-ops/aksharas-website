<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Aksharas Review Approval</title><link rel="stylesheet" href="styles.css"><style>body{background:#fff9ef}.admin-wrap{max-width:920px;margin:40px auto;padding:20px}.admin-panel{background:#fff;border:1px solid #eadfce;border-radius:18px;padding:24px;box-shadow:0 8px 30px #153d3010}.admin-panel h1{color:#004d40}.admin-field{display:grid;gap:6px;margin:12px 0}.admin-field input{padding:12px;border:1px solid #d6cdbf;border-radius:8px}.admin-btn{border:0;border-radius:24px;padding:10px 16px;background:#ff6500;color:#fff;font-weight:700;cursor:pointer;margin:6px 6px 0 0}.admin-btn.secondary{background:#004d40}.admin-btn.reject{background:#8d2929}.review-row{border:1px solid #e8dfd3;border-radius:12px;padding:16px;margin:14px 0}.review-row p{white-space:pre-wrap}.admin-status{min-height:24px;color:#004d40}.muted{color:#6b716d;font-size:.9rem}</style></head>
<body><main class="admin-wrap"><section class="admin-panel"><h1>Aksharas – Customer Review Approval</h1><p class="muted">Sign in with your website review-management account. Senior Manager approves reviews; Admin publishes approved five-star comments.</p><form id="login-form"><div class="admin-field"><label>Email</label><input type="email" name="email" required autocomplete="username"></div><div class="admin-field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div><button class="admin-btn">Sign in</button></form><div id="admin-app" hidden><p id="role-label" class="muted"></p><button id="refresh" class="admin-btn secondary">Refresh reviews</button><button id="logout" class="admin-btn reject">Sign out</button><div id="reviews-list"></div></div><p id="admin-status" class="admin-status" role="status" aria-live="polite"></p></section></main><script src="config.js"></script><script type="module" src="reviews-admin.js"></script></body></html>
